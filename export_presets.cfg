[preset.0]

name="Android TV"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="../build/traffic-runner.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

; Gradle = necesario para que aparezca en el menú de Android TV (categoría LEANBACK_LAUNCHER)
gradle_build/use_gradle_build=true
; muchos Android TV corren 32 bits (armeabi-v7a): se incluyen ambas
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="1.0"
package/unique_name="com.semillero.motorunner"
package/name="Gamedev - Traffic Runner"
package/signed=true
package/show_in_android_tv=true
package/show_in_app_library=true
screen/immersive_mode=true

[preset.1]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
; itch.io necesita que el archivo principal se llame index.html
export_path="../build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

; sin hilos = funciona en itch.io y cualquier navegador sin activar SharedArrayBuffer
variant/thread_support=false
variant/extensions_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
